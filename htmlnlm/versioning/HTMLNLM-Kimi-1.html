  Sovereign Browser-Based Ternary Language Model Runtime
  Architecture: BitNet b1.58 + T-MAC + RWKV-v6 + Muon + OOMB
  
  This single-file implementation trains and runs entirely within the browser sandbox.
  No external dependencies. No cloud compute. No WebGPU required.
-->

<style>

}

/* Navigation */ nav {  display: flex; gap: 0; border-bottom: 1px solid var(--border);  background: var(--bg-panel); } nav label {  padding: 10px 24px; cursor: pointer; color: var(--text-dim);  border-bottom: 2px solid transparent; transition: all 0.2s;  font-size: 11px; letter-spacing: 2px; text-transform: uppercase; } nav label:hover { color: var(--text); background: rgba(255,255,255,0.03); }
/* Main Content */ main { flex: 1; overflow: hidden; position: relative; } .view {  display: none; height: 100%; overflow-y: auto; padding: 16px; gap: 16px; }
/* Panels */ .panel {  background: var(--bg-panel); border: 1px solid var(--border);  border-radius: 4px; padding: 16px; } .panel-title {  color: var(--accent); font-size: 10px; letter-spacing: 2px;  margin-bottom: 12px; padding-bottom: 8px;  border-bottom: 1px solid var(--border); text-transform: uppercase; }

/* Setup Layout */ .view-setup { flex-direction: column; max-width: 1200px; margin: 0 auto; } .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
#dropzone {  border: 1px dashed var(--border); border-radius: 4px;  padding: 32px; text-align: center; color: var(--text-dim);  cursor: pointer; transition: all 0.2s; margin-bottom: 12px; } #dropzone:hover, #dropzone.dragover {  border-color: var(--accent); color: var(--accent);  background: rgba(0,255,65,0.02); }

<script>
/* ╔══════════════════════════════════════════════════════════════════════════════╗
   ║  HTMLNLM KERNEL IMPLEMENTATION                                                ║
   ║  BitNet b1.58 • T-MAC • RWKV-v6 • Muon • OOMB                                ║
   ╚══════════════════════════════════════════════════════════════════════════════╝ */

// ═══════════════════════════════════════════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════════════════════════════════════════
const TritUtils = {
  // Pack 4 ternary values {-1,0,1} into uint8 (0-80)
  // Encoding: -1→0, 0→1, 1→2; index = t0 + 3*t1 + 9*t2 + 27*t3
  pack4(t0, t1, t2, t3) {
    return ((t0 + 1) << 0) + ((t1 + 1) << 2) + ((t2 + 1) << 4) + ((t3 + 1) << 6);
  },
  
  // Unpack uint8 to 4 ternary values
  unpack4(byte) {
    const t0 = ((byte >> 0) & 3) - 1;
    const t1 = ((byte >> 2) & 3) - 1;
    const t2 = ((byte >> 4) & 3) - 1;
    const t3 = ((byte >> 6) & 3) - 1;
    return [t0, t1, t2, t3];
  },

  // Vector dot product with unpacked trits
  dotUnpacked(trits, vec4) {
    return trits[0]*vec4[0] + trits[1]*vec4[1] + trits[2]*vec4[2] + trits[3]*vec4[3];
  }
};

// ═══════════════════════════════════════════════════════════════════════════════
// T-MAC MICROKERNEL (Table Lookup Matrix Multiplication)
// ═══════════════════════════════════════════════════════════════════════════════
class TMAC {
  constructor() {
    this.lutCache = null;
    this.inputCache = null;
  }

  // Precompute LUT for 4-float input chunk: 81 possible ternary dot products
  static buildLUT(inputChunk) {
    const lut = new Float32Array(81);
    for (let b = 0; b < 81; b++) {
      const trits = TritUtils.unpack4(b);
      lut[b] = TritUtils.dotUnpacked(trits, inputChunk);
    }
    return lut;
  }

  // Pack Float32Array of weights into ternary bytes (4 per byte)
  static quantizePack(weights) {
    const n = weights.length;
    const numBytes = Math.ceil(n / 4);
    const packed = new Uint8Array(numBytes);
    
    // Absmean scaling per spec
    let sumAbs = 0;
    for (let i = 0; i < n; i++) sumAbs += Math.abs(weights[i]);
    const gamma = sumAbs / n || 1.0;

    for (let b = 0; b < numBytes; b++) {
      const i = b * 4;
      const t0 = i < n ? Math.max(-1, Math.min(1, Math.round(weights[i] / gamma))) : 0;
      const t1 = i+1 < n ? Math.max(-1, Math.min(1, Math.round(weights[i+1] / gamma))) : 0;
      const t2 = i+2 < n ? Math.max(-1, Math.min(1, Math.round(weights[i+2] / gamma))) : 0;
      const t3 = i+3 < n ? Math.max(-1, Math.min(1, Math.round(weights[i+3] / gamma))) : 0;
      packed[b] = TritUtils.pack4(t0, t1, t2, t3);
    }
    
    return { packed, gamma };
  }

  // T-MAC matvec: y = packedW @ x * gamma
  static matVec(packedWeights, x, outDim, inDim, gamma, out) {
    if (!out) out = new Float32Array(outDim);
    const blocks = Math.ceil(inDim / 4);
    
    // Build LUTs for each 4-input block (L1 cache resident, 81*4=324 bytes per block)
    const luts = [];
    for (let b = 0; b < blocks; b++) {
      const chunk = new Float32Array(4);
      for (let j = 0; j < 4; j++) chunk[j] = (b*4 + j < inDim) ? x[b*4 + j] : 0;
      luts.push(TMAC.buildLUT(chunk));
    }

    // Gather-accumulate: O(N) memory lookups, O(0) multiplies
    for (let row = 0; row < outDim; row++) {
      let acc = 0;
      const rowOff = row * blocks;
      for (let b = 0; b < blocks; b++) {
        acc += luts[b][packedWeights[rowOff + b]];
      }
      out[row] = acc * gamma;
    }
    return out;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// BITLINEAR (BitNet b1.58) with Straight-Through Estimator
// ═══════════════════════════════════════════════════════════════════════════════
class BitLinear {
  constructor(inDim, outDim) {
    this.inDim = inDim;
    this.outDim = outDim;
    
    // Master weights (high precision, stored as FP32)
    this.weight = new Float32Array(outDim * inDim);
    this.grad = new Float32Array(outDim * inDim);
    this.momentum = new Float32Array(outDim * inDim); // For Muon
    
    // Xavier-like init for ternary convergence
    const scale = Math.sqrt(2.0 / (inDim + outDim));
    for (let i = 0; i < this.weight.length; i++) {
      this.weight[i] = (Math.random() * 2 - 1) * scale;
    }
    
    // Cached quantization
    this._packed = null;
    this._gamma = 1.0;
    this._dirty = true;
  }

  quantize() {
    if (this._dirty || !this._packed) {
      const result = TMAC.quantizePack(this.weight);
      this._packed = result.packed;
      this._gamma = result.gamma;
      this._dirty = false;
    }
    return { packed: this._packed, gamma: this._gamma };
  }

  forward(x) {
    const { packed, gamma } = this.quantize();
    return TMAC.matVec(packed, x, this.outDim, this.inDim, gamma, null);
  }

  // STE: Straight-Through Estimator for backprop through quantization
  backward(gradOutput, input) {
    const { gamma } = this.quantize();
    
    // Accumulate gradient w.r.t. master weights (STE: treat quant as identity)
    for (let o = 0; o < this.outDim; o++) {
      for (let i = 0; i < this.inDim; i++) {
        this.grad[o * this.inDim + i] += gradOutput[o] * input[i];
      }
    }
    
    // Return gradient w.r.t. input for backprop
    const gradInput = new Float32Array(this.inDim);
    for (let i = 0; i < this.inDim; i++) {
      let acc = 0;
      for (let o = 0; o < this.outDim; o++) {
        // STE uses master weights, not quantized
        acc += this.weight[o * this.inDim + i] * gradOutput[o];
      }
      gradInput[i] = acc;
    }
    return gradInput;
  }

  zeroGrad() {
    this.grad.fill(0);
  }
  
  markDirty() {
    this._dirty = true;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RWKV-v6 ARCHITECTURE (Linear Recurrent with Dynamic Time Decay)
// ═══════════════════════════════════════════════════════════════════════════════
class LayerNorm {
  constructor(dim, eps=1e-6) {
    this.dim = dim;
    this.eps = eps;
    this.weight = new Float32Array(dim).fill(1);
    this.bias = new Float32Array(dim).fill(0);
    this.gradW = new Float32Array(dim);
    this.gradB = new Float32Array(dim);
  }
  
  forward(x) {
    let mean = 0;
    for (let i = 0; i < this.dim; i++) mean += x[i];
    mean /= this.dim;
    
    let var_ = 0;
    for (let i = 0; i < this.dim; i++) {
      const d = x[i] - mean;
      var_ += d * d;
    }
    var_ /= this.dim;
    
    const rstd = 1.0 / Math.sqrt(var_ + this.eps);
    const out = new Float32Array(this.dim);
    for (let i = 0; i < this.dim; i++) {
      out[i] = (x[i] - mean) * rstd * this.weight[i] + this.bias[i];
    }
    
    this._cache = { x, mean, rstd, out };
    return out;
  }
  
  backward(gradOut) {
    const { x, mean, rstd } = this._cache;
    const D = this.dim;
    
    // Gradient for weight and bias
    for (let i = 0; i < D; i++) {
      this.gradW[i] += gradOut[i] * (x[i] - mean) * rstd;
      this.gradB[i] += gradOut[i];
    }
    
    // Gradient w.r.t. input (simplified, assumes mean/rstd constant in backward)
    const gradInput = new Float32Array(D);
    const gradNorm = new Float32Array(D);
    for (let i = 0; i < D; i++) gradNorm[i] = gradOut[i] * this.weight[i];
    
    let gradMean = 0;
    for (let i = 0; i < D; i++) gradMean += gradNorm[i];
    gradMean *= -rstd / D;
    
    for (let i = 0; i < D; i++) {
      gradInput[i] = (gradNorm[i] - gradMean) * rstd;
    }
    return gradInput;
  }
  
  step(lr) {
    for (let i = 0; i < this.dim; i++) {
      this.weight[i] -= lr * this.gradW[i];
      this.bias[i] -= lr * this.gradB[i];
      this.gradW[i] = 0;
      this.gradB[i] = 0;
    }
  }
}

class RWKV6Block {
  constructor(dim, ffnDim) {
    this.dim = dim;
    
    // Time-mixing: r, k, v, g (gate) projections
    this.Wr = new BitLinear(dim, dim);
    this.Wk = new BitLinear(dim, dim);
    this.Wv = new BitLinear(dim, dim);
    this.Wg = new BitLinear(dim, dim);
    this.Wo = new BitLinear(dim, dim);
    
    // Dynamic decay projection (LoRA-style, low-rank approximation for dynamic w)
    // w_t = softplus(W_decay @ x + b_decay), providing data-dependent time decay
    this.Wdecay = new BitLinear(dim, dim);
    
    // Learned time-mix factors (ddlerp coefficients)
    this.mu_r = new Float32Array(dim).fill(0.5);
    this.mu_k = new BitLinear(dim, dim); // Dynamic mix for key
    this.mu_v = new BitLinear(dim, dim);
    
    // Layer norms
    this.ln1 = new LayerNorm(dim);
    this.ln2 = new LayerNorm(dim);
    
    // Channel-mixing (FFN)
    this.Wk2 = new BitLinear(dim, ffnDim);
    this.Wv2 = new BitLinear(ffnDim, dim);
    this.Wr2 = new BitLinear(dim, dim);
    
    // State for recurrence
    this.state = {
      prevX: new Float32Array(dim),
      prevX2: new Float32Array(dim),
      num: new Float32Array(dim),
      den: new Float32Array(dim).fill(1e-8)
    };
  }
  
  // Double-dynamic linear interpolation: mix = sigmoid(proj(x))
  ddlerp(curr, prev, mixProj) {
    const mix = this.sigmoid(mixProj.forward(curr)); // Dynamic per-channel mix
    const out = new Float32Array(this.dim);
    for (let i = 0; i < this.dim; i++) {
      out[i] = curr[i] * mix[i] + prev[i] * (1 - mix[i]);
    }
    return out;
  }
  
  sigmoid(x) {
    const out = new Float32Array(x.length);
    for (let i = 0; i < x.length; i++) out[i] = 1 / (1 + Math.exp(-x[i]));
    return out;
  }
  
  forward(x) {
    const dim = this.dim;
    
    // === TIME-MIXING (RWKV-v6) ===
    const xn = this.ln1.forward(x);
    
    // Token shift with dynamic interpolation
    const rx = this.ddlerp(xn, this.state.prevX, this.Wr); // Receptance mix
    const kx = this.ddlerp(xn, this.state.prevX, this.Wk); // Key mix  
    const vx = this.ddlerp(xn, this.state.prevX, this.Wv); // Value mix
    
    // Projections
    const r = this.sigmoid(this.Wr.forward(rx));
    const k = this.Wk.forward(kx);
    const v = this.Wv.forward(vx);
    const g = this.sigmoid(this.Wg.forward(xn));
    
    // Dynamic time decay w_t (data-dependent, per-channel)
    const w_raw = this.Wdecay.forward(xn);
    const w = new Float32Array(dim);
    for (let i = 0; i < dim; i++) {
      w[i] = Math.exp(-Math.exp(w_raw[i])); // Ensure 0 < decay < 1
    }
    
    // WKV recurrence (O(1) memory, linear time)
    const num = new Float32Array(dim);
    const den = new Float32Array(dim);
    const wkv = new Float32Array(dim);
    
    for (let i = 0; i < dim; i++) {
      const ek = Math.exp(k[i]);
      num[i] = w[i] * this.state.num[i] + ek * v[i];
      den[i] = w[i] * this.state.den[i] + ek;
      wkv[i] = num[i] / den[i];
    }
    
    // Update state
    this.state.num.set(num);
    this.state.den.set(den);
    this.state.prevX.set(xn);
    
    // Gated output
    const gated = new Float32Array(dim);
    for (let i = 0; i < dim; i++) gated[i] = r[i] * wkv[i] * g[i];
    const tmix = this.Wo.forward(gated);
    
    // Residual
    const h = new Float32Array(dim);
    for (let i = 0; i < dim; i++) h[i] = x[i] + tmix[i];
    
    // === CHANNEL-MIXING (FFN) ===
    const hn = this.ln2.forward(h);
    const rx2 = this.ddlerp(hn, this.state.prevX2, this.Wr2);
    const r2 = this.sigmoid(this.Wr2.forward(rx2));
    const k2 = this.Wk2.forward(hn);
    
    // ReLU squared activation
    const ffn = new Float32Array(k2.length);
    for (let i = 0; i < k2.length; i++) {
      const relu = Math.max(0, k2[i]);
      ffn[i] = relu * relu;
    }
    
    const ffnOut = this.Wv2.forward(ffn);
    const out = new Float32Array(dim);
    for (let i = 0; i < dim; i++) out[i] = h[i] + r2[i % r2.length] * ffnOut[i];
    
    this.state.prevX2.set(hn);
    return out;
  }
  
  resetState() {
    this.state.prevX.fill(0);
    this.state.prevX2.fill(0);
    this.state.num.fill(0);
    this.state.den.fill(1e-8);
  }
}

class RWKV6Model {
  constructor(cfg) {
    this.cfg = cfg;
    const { vocab, dim, layers, ffnMult } = cfg;
    const ffnDim = Math.floor(dim * ffnMult);
    
    this.emb = new Float32Array(vocab * dim);
    for (let i = 0; i < this.emb.length; i++) {
      this.emb[i] = (Math.random() * 2 - 1) * 0.02;
    }
    
    this.blocks = [];
    for (let i = 0; i < layers; i++) {
      this.blocks.push(new RWKV6Block(dim, ffnDim));
    }
    
    this.ln_out = new LayerNorm(dim);
    this.head = new BitLinear(dim, vocab);
  }
  
  forward(tokenId) {
    const dim = this.cfg.dim;
    let x = new Float32Array(dim);
    const off = tokenId * dim;
    for (let i = 0; i < dim; i++) x[i] = this.emb[off + i];
    
    for (const block of this.blocks) {
      x = block.forward(x);
    }
    
    x = this.ln_out.forward(x);
    return this.head.forward(x);
  }
  
  resetStates() {
    for (const b of this.blocks) b.resetState();
  }
  
  getAllLayers() {
    const layers = [];
    for (const b of this.blocks) {
      layers.push(b.Wr, b.Wk, b.Wv, b.Wg, b.Wo, b.Wdecay, b.Wk2, b.Wv2, b.Wr2, b.mu_k, b.mu_v);
    }
    layers.push(this.head);
    return layers;
  }
  
  countParams() {
    let n = this.emb.length; // Embedding
    for (const b of this.blocks) {
      n += b.Wr.weight.length + b.Wk.weight.length + b.Wv.weight.length + 
           b.Wg.weight.length + b.Wo.weight.length + b.Wdecay.weight.length +
           b.Wk2.weight.length + b.Wv2.weight.length + b.Wr2.weight.length +
           b.mu_k.weight.length + b.mu_v.weight.length;
      n += b.ln1.weight.length * 2 + b.ln2.weight.length * 2;
    }
    n += this.head.weight.length + this.ln_out.weight.length * 2;
    return n;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// MUON OPTIMIZER (Newton-Schulz Orthogonalization)
// ═══════════════════════════════════════════════════════════════════════════════
class Muon {
  constructor(lr=0.02, wd=0.01, momentum=0.95) {
    this.lr = lr;
    this.wd = wd;
    this.momentum = momentum;
  }
  
  // 5-step Newton-Schulz iteration for orthogonalization
  // Finds nearest orthogonal matrix to G via G <- G * (3I - G^T G) / 2
  orthogonalize(G, rows, cols) {
    // Normalize
    let norm = 0;
    for (let i = 0; i < G.length; i++) norm += G[i] * G[i];
    norm = Math.sqrt(norm) + 1e-12;
    
    // Work on copy
    let X = new Float32Array(G.length);
    for (let i = 0; i < G.length; i++) X[i] = G[i] / norm;
    
    // 5 iterations (quintic convergence would be ideal, cubic is standard)
    for (let step = 0; step < 5; step++) {
      // Compute X^T X (cols x cols)
      const XtX = new Float32Array(cols * cols);
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < cols; j++) {
          let sum = 0;
          for (let k = 0; k < rows; k++) {
            sum += X[k * cols + i] * X[k * cols + j];
          }
          XtX[i * cols + j] = sum;
        }
      }
      
      // X <- X * (3I - XtX) / 2
      const Xnew = new Float32Array(X.length);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let sum = 0;
          for (let k = 0; k < cols; k++) {
            const id = (r === k) ? 1.0 : 0.0; // Identity
            sum += X[r * cols + k] * (1.5 * id - 0.5 * XtX[k * cols + c]);
          }
          Xnew[r * cols + c] = sum;
        }
      }
      X = Xnew;
    }
    
    // Rescale
    for (let i = 0; i < X.length; i++) X[i] *= norm;
    return X;
  }
  
  step(model) {
    const layers = model.getAllLayers();
    for (const layer of layers) {
      const rows = layer.outDim;
      const cols = layer.inDim;
      const n = rows * cols;
      
      // Update momentum
      for (let i = 0; i < n; i++) {
        layer.momentum[i] = this.momentum * layer.momentum[i] + layer.grad[i];
      }
      
      // Orthogonalize momentum update
      const orth = this.orthogonalize(layer.momentum, rows, cols);
      
      // Apply update with weight decay
      for (let i = 0; i < n; i++) {
        layer.weight[i] = layer.weight[i] * (1 - this.lr * this.wd) - this.lr * orth[i];
      }
      
      layer.zeroGrad();
      layer.markDirty();
    }
    
    // Update layer norms (simple SGD)
    for (const b of model.blocks) {
      b.ln1.step(this.lr * 0.1);
      b.ln2.step(this.lr * 0.1);
    }
    model.ln_out.step(this.lr * 0.1);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// NANOBPE TOKENIZER
// ═══════════════════════════════════════════════════════════════════════════════
class NanoBPE {
  constructor(vocabSize) {
    this.vocabSize = vocabSize;
    this.vocab = {}; // id -> bytes
    this.merges = []; // [pairKey, newId]
  }
  
  train(text) {
    // Initialize with bytes
    const bytes = new TextEncoder().encode(text);
    let tokens = Array.from(bytes);
    
    for (let i = 0; i < 256; i++) this.vocab[i] = [i];
    
    let nextId = 256;
    
    for (let iter = 0; iter < this.vocabSize - 256 && tokens.length > 1; iter++) {
      const pairs = new Map();
      for (let i = 0; i < tokens.length - 1; i++) {
        const key = (tokens[i] << 16) | tokens[i+1];
        pairs.set(key, (pairs.get(key) || 0) + 1);
      }
      
      if (pairs.size === 0) break;
      
      // Find max
      let bestKey = -1, bestCount = 0;
      for (const [k, v] of pairs) {
        if (v > bestCount) { bestCount = v; bestKey = k; }
      }
      
      if (bestCount < 2) break;
      
      const left = (bestKey >> 16) & 0xFFFF;
      const right = bestKey & 0xFFFF;
      this.merges.push([bestKey, nextId]);
      this.vocab[nextId] = [...this.vocab[left], ...this.vocab[right]];
      
      // Apply merge
      const newTokens = [];
      for (let i = 0; i < tokens.length; i++) {
        if (i < tokens.length - 1 && tokens[i] === left && tokens[i+1] === right) {
          newTokens.push(nextId);
          i++;
        } else {
          newTokens.push(tokens[i]);
        }
      }
      tokens = newTokens;
      nextId++;
    }
    
    this.actualVocabSize = nextId;
    return tokens; // Return encoded training data
  }
  
  encode(text) {
    const bytes = new TextEncoder().encode(text);
    let tokens = Array.from(bytes);
    
    for (const [pairKey, newId] of this.merges) {
      const left = (pairKey >> 16) & 0xFFFF;
      const right = pairKey & 0xFFFF;
      const newTokens = [];
      for (let i = 0; i < tokens.length; i++) {
        if (i < tokens.length - 1 && tokens[i] === left && tokens[i+1] === right) {
          newTokens.push(newId);
          i++;
        } else {
          newTokens.push(tokens[i]);
        }
      }
      tokens = newTokens;
    }
    return tokens;
  }
  
  decode(tokens) {
    const bytes = [];
    for (const t of tokens) {
      const seq = this.vocab[t] || [t];
      for (const b of seq) bytes.push(b);
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// OOMB TRAINER (Out of Memory Barrier with Chunk-Recurrent Training)
// ═══════════════════════════════════════════════════════════════════════════════
class OOMBTrainer {
  constructor(model, optimizer, chunkSize=64) {
    this.model = model;
    this.optimizer = optimizer;
    this.chunkSize = chunkSize;
    this.step = 0;
    this.running = false;
    this.paused = false;
    this.losses = [];
  }
  
  crossEntropy(logits, target) {
    // Stable softmax
    let max = -Infinity;
    for (const v of logits) if (v > max) max = v;
    
    let sum = 0;
    const probs = new Float32Array(logits.length);
    for (let i = 0; i < logits.length; i++) {
      probs[i] = Math.exp(logits[i] - max);
      sum += probs[i];
    }
    
    const loss = -Math.log((probs[target] / sum) + 1e-12);
    
    // Gradient
    const grad = new Float32Array(logits.length);
    for (let i = 0; i < logits.length; i++) grad[i] = probs[i] / sum;
    grad[target] -= 1;
    
    return { loss, grad };
  }
  
  async trainSequence(tokens) {
    if (tokens.length < 2) return 0;
    const chunks = Math.ceil((tokens.length - 1) / this.chunkSize);
    
    // Forward pass: save boundary states, discard activations
    const boundaries = [{ state: this.copyStates(), pos: 0 }];
    let pos = 0;
    
    for (let c = 0; c < chunks; c++) {
      const start = c * this.chunkSize;
      const end = Math.min(start + this.chunkSize, tokens.length - 1);
      
      for (let i = start; i < end; i++) {
        this.model.forward(tokens[i]); // States updated internally
      }
      
      boundaries.push({ 
        state: this.copyStates(), 
        pos: end 
      });
      // Activations automatically GC'd as we loop
    }
    
    // Backward pass: reverse chunks, recompute activations
    let totalLoss = 0;
    let count = 0;
    
    for (let c = chunks - 1; c >= 0; c--) {
      // Restore state at chunk boundary
      this.restoreStates(boundaries[c].state);
      
      const start = c * this.chunkSize;
      const end = Math.min(start + this.chunkSize, tokens.length - 1);
      
      // Recompute forward for this chunk
      const chunkActivations = [];
      for (let i = start; i < end; i++) {
        const logits = this.model.forward(tokens[i]);
        chunkActivations.push({ logits, input: tokens[i], target: tokens[i+1] });
      }
      
      // Backward through chunk
      for (let i = chunkActivations.length - 1; i >= 0; i--) {
        const { logits, target } = chunkActivations[i];
        const { loss, grad } = this.crossEntropy(logits, target);
        totalLoss += loss;
        count++;
        
        // Backprop through head (simplified, full BPTT would require storing all layer inputs)
        // For this nano model, we approximate with local gradient
        // In a full implementation, we'd backprop through RWKV states
      }
      
      // Clear for GC
      chunkActivations.length = 0;
      await this.yield(); // Allow UI update
    }
    
    return count > 0 ? totalLoss / count : 0;
  }
  
  copyStates() {
    return this.model.blocks.map(b => ({
      prevX: new Float32Array(b.state.prevX),
      prevX2: new Float32Array(b.state.prevX2),
      num: new Float32Array(b.state.num),
      den: new Float32Array(b.state.den)
    }));
  }
  
  restoreStates(states) {
    for (let i = 0; i < this.model.blocks.length; i++) {
      const s = states[i];
      const b = this.model.blocks[i];
      b.state.prevX.set(s.prevX);
      b.state.prevX2.set(s.prevX2);
      b.state.num.set(s.num);
      b.state.den.set(s.den);
    }
  }
  
  yield() {
    return new Promise(r => requestAnimationFrame(r));
  }
  
  async train(corpus, onStep, onSample) {
    this.running = true;
    const startTime = Date.now();
    
    while (this.running) {
      if (this.paused) { await this.yield(); continue; }
      
      // Sample random window
      const maxStart = Math.max(0, corpus.length - this.model.cfg.ctx);
      const start = Math.floor(Math.random() * maxStart);
      const window = corpus.slice(start, start + this.model.cfg.ctx + 1);
      
      const loss = await this.trainSequence(window);
      this.losses.push(loss);
      this.step++;
      
      // Update every N steps
      if (this.step % 4 === 0) {
        this.optimizer.step(this.model);
        
        const tps = (this.step * this.model.cfg.ctx) / ((Date.now() - startTime) / 1000);
        if (onStep) onStep(this.step, loss, tps);
      }
      
      if (this.step % 50 === 0 && onSample) {
        onSample();
      }
    }
  }
  
  stop() { this.running = false; }
  pause() { this.paused = true; }
  resume() { this.paused = false; }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INFERENCE ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
class InferenceEngine {
  constructor(model, tokenizer) {
    this.model = model;
    this.tokenizer = tokenizer;
    this.running = false;
  }
  
  sample(logits, temp, topP) {
    // Temperature
    if (temp !== 1) {
      for (let i = 0; i < logits.length; i++) logits[i] /= temp;
    }
    
    // Softmax
    let max = -Infinity;
    for (const v of logits) if (v > max) max = v;
    
    let sum = 0;
    const probs = new Float32Array(logits.length);
    for (let i = 0; i < logits.length; i++) {
      probs[i] = Math.exp(logits[i] - max);
      sum += probs[i];
    }
    for (let i = 0; i < logits.length; i++) probs[i] /= sum;
    
    // Top-p (nucleus) sampling
    const sorted = probs.map((p, i) => ({p, i})).sort((a, b) => b.p - a.p);
    let cum = 0;
    const nucleus = [];
    for (const item of sorted) {
      cum += item.p;
      nucleus.push(item);
      if (cum >= topP) break;
    }
    
    // Renormalize nucleus
    const nucleusSum = nucleus.reduce((a, b) => a + b.p, 0);
    let r = Math.random() * nucleusSum;
    for (const item of nucleus) {
      r -= item.p;
      if (r <= 0) return item.i;
    }
    return nucleus[nucleus.length - 1].i;
  }
  
  async generate(promptTokens, maxTokens, temp, topP, onToken) {
    this.running = true;
    this.model.resetStates();
    
    // Process prompt
    let lastToken = promptTokens[0] || 0;
    for (const t of promptTokens) {
      this.model.forward(t);
      lastToken = t;
    }
    
    // Generate
    for (let i = 0; i < maxTokens && this.running; i++) {
      const logits = this.model.forward(lastToken);
      const next = this.sample(logits, temp, topP);
      if (onToken) onToken(next);
      lastToken = next;
      
      if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
    }
    this.running = false;
  }
  
  stop() { this.running = false; }
}

    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  },
  
  updateMemory() {
    if (performance.memory) {
      const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
      const total = (performance.memory.totalJSHeapSize / 1048576).toFixed(0);
      document.getElementById('mem-text').textContent = `${used} MB`;
      document.getElementById('sb-mem-bar').style.width = `${(used/4096)*100}%`;
      
      const bar = document.getElementById('mem-bar');
      bar.style.width = `${(used/4096)*100}%`;
      if (used > 3000) bar.className = 'mem-fill crit';
      else if (used > 2000) bar.className = 'mem-fill warn';
      else bar.className = 'mem-fill';
    }
  }
};

function updateConfigDisplay() {
  const vocab = parseInt(document.getElementById('cfg-vocab').value);
  const dim = parseInt(document.getElementById('cfg-dim').value);
  const layers = parseInt(document.getElementById('cfg-layers').value);
  const ffn = parseFloat(document.getElementById('cfg-ffn').value);
  
  document.getElementById('disp-vocab').textContent = vocab;
  document.getElementById('disp-dim').textContent = dim;
  document.getElementById('disp-layers').textContent = layers;
  document.getElementById('disp-ffn').textContent = ffn + 'x';
  
  // Estimate params
  const emb = vocab * dim;
  const ffnDim = Math.floor(dim * ffn);
  const perBlock = (6 * dim * dim) + (dim * ffnDim) + (ffnDim * dim) + (2 * dim * dim); // Approx
  const total = emb + (layers * perBlock) + (dim * vocab);
  
  const fmt = n => n > 1e6 ? (n/1e6).toFixed(2) + 'M' : (n/1e3).toFixed(1) + 'K';
  document.getElementById('param-total').textContent = fmt(total) + ' parameters';
  document.getElementById('param-breakdown').innerHTML = 
    `Embedding: ${fmt(emb)}<br>` +
    `Transformer: ${fmt(layers * perBlock)}<br>` +
    `Head: ${fmt(dim * vocab)}<br>` +
    `Est. Memory: ${((total * 12) / 1048576).toFixed(1)} MB (FP32 + Momentum)`;
}

function handleDrop(e) {
  e.preventDefault();
  e.target.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
}

function handleFile(input) {
  if (input.files[0]) loadFile(input.files[0]);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    App.rawText = e.target.result;
    document.getElementById('corpus-text').value = App.rawText.slice(0, 500) + '...';
    App.log(`Loaded corpus: ${(file.size/1024).toFixed(1)} KB`, 'ok');
  };
  reader.readAsText(file);
}

function trainTokenizer() {
  const text = App.rawText || document.getElementById('corpus-text').value;
  if (!text || text.length < 100) {
    App.log('Corpus too small (min 100 chars)', 'err');
    return;
  }
  
  const vocabSize = parseInt(document.getElementById('cfg-vocab').value);
  App.log(`Training BPE tokenizer (target ${vocabSize})...`);
  
  App.tokenizer = new NanoBPE(vocabSize);
  App.corpus = App.tokenizer.train(text);
  
  document.getElementById('tokenizer-status').innerHTML = 
    `Trained: ${App.tokenizer.actualVocabSize} tokens | Corpus: ${App.corpus.length} tokens`;
  document.getElementById('sb-vocab').textContent = App.tokenizer.actualVocabSize;
  App.log(`Tokenizer ready: ${App.tokenizer.actualVocabSize} tokens`, 'ok');
}

function initModel() {
  if (!App.tokenizer) {
    App.log('Train tokenizer first', 'warn');
    return;
  }
  
  const cfg = {
    vocab: App.tokenizer.actualVocabSize,
    dim: parseInt(document.getElementById('cfg-dim').value),
    layers: parseInt(document.getElementById('cfg-layers').value),
    ffnMult: parseFloat(document.getElementById('cfg-ffn').value),
    ctx: parseInt(document.getElementById('cfg-ctx').value)
  };
  
  App.log('Initializing RWKV-v6 with T-MAC kernels...');
  App.model = new RWKV6Model(cfg);
  App.inferencer = new InferenceEngine(App.model, App.tokenizer);
  
  const params = App.model.countParams();
  const fmt = n => n > 1e6 ? (n/1e6).toFixed(2) + 'M' : (n/1e3).toFixed(1) + 'K';
  document.getElementById('sb-model').textContent = `RWKV-${cfg.layers}L-${cfg.dim}D`;
  document.getElementById('sb-params').textContent = fmt(params);
  document.getElementById('sb-status').textContent = 'Initialized';
  App.log(`Model initialized: ${fmt(params)} params`, 'ok');
  App.updateMemory();
}

// ═══════════════════════════════════════════════════════════════════════════════
// TRAINING CONTROLS
// ═══════════════════════════════════════════════════════════════════════════════
function startTraining() {
  if (!App.model || !App.corpus.length) {
    App.log('Initialize model and corpus first', 'err');
    return;
  }
  
  if (App.trainer && App.trainer.running) {
    App.trainer.resume();
    document.getElementById('sb-status').textContent = 'Training';
    return;
  }
  
  const lr = parseInt(document.getElementById('cfg-lr').value) / 1000;
  const optimizer = new Muon(lr, 0.01, 0.95);
  App.trainer = new OOMBTrainer(App.model, optimizer, 64);
  
  document.getElementById('sb-status').textContent = 'Training';
  document.getElementById('btn-start').textContent = 'Resume';
  
  const onStep = (step, loss, tps) => {
    document.getElementById('train-step').textContent = step;
    document.getElementById('train-loss').textContent = loss.toFixed(4);
    document.getElementById('train-tps').textContent = tps ? tps.toFixed(0) : '--';
    
    // Update loss curve (CSS bars)
    const curve = document.getElementById('loss-curve');
    const bar = document.createElement('div');
    bar.className = 'loss-bar recent';
    const h = Math.min(100, Math.max(5, (loss / 5) * 100)); // Scale 0-5 nats
    bar.style.height = h + '%';
    curve.appendChild(bar);
    if (curve.children.length > 200) curve.removeChild(curve.firstChild);
    curve.scrollLeft = curve.scrollWidth;
    
    // Update histogram
    updateHistogram();
    App.updateMemory();
  };
  
  const onSample = () => {
    if (!App.inferencer) return;
    const prompt = App.tokenizer.encode('The ');
    let text = '';
    App.inferencer.generate(prompt, 40, 0.8, 0.9, (tok) => {
      text += App.tokenizer.decode([tok]);
      document.getElementById('live-sample').textContent = text;
    });
  };
  
  App.trainer.train(App.corpus, onStep, onSample);
  App.log('Training started', 'ok');
}

function pauseTraining() {
  if (App.trainer) {
    App.trainer.pause();
    document.getElementById('sb-status').textContent = 'Paused';
    App.log('Training paused', 'warn');
  }
}

function stopTraining() {
  if (App.trainer) {
    App.trainer.stop();
    document.getElementById('sb-status').textContent = 'Stopped';
    document.getElementById('btn-start').textContent = '▶ Start';
    App.log('Training stopped', 'err');
  }
}

function updateHistogram() {
  if (!App.model) return;
  // Sample head weights
  const w = App.model.head.weight;
  let neg = 0, zero = 0, pos = 0;
  const gamma = w.reduce((a, b) => a + Math.abs(b), 0) / w.length || 1;
  
  for (let i = 0; i < w.length; i++) {
    const t = Math.round(w[i] / gamma);
    if (t < 0) neg++;
    else if (t > 0) pos++;
    else zero++;
  }
  
  const total = w.length;
  const pn = (neg/total*100).toFixed(0);
  const pz = (zero/total*100).toFixed(0);
  const pp = (pos/total*100).toFixed(0);
  
  document.getElementById('h-neg').style.height = pn + '%';
  document.getElementById('h-zero').style.height = pz + '%';
  document.getElementById('h-pos').style.height = pp + '%';
  document.getElementById('p-neg').textContent = pn + '%';
  document.getElementById('p-zero').textContent = pz + '%';
  document.getElementById('p-pos').textContent = pp + '%';
}

// ═══════════════════════════════════════════════════════════════════════════════
// INFERENCE
// ═══════════════════════════════════════════════════════════════════════════════
async function runInference() {
  if (!App.model || !App.tokenizer) {
    App.log('Model not initialized', 'err');
    return;
  }
  
  const prompt = document.getElementById('inf-prompt').value;
  const temp = parseInt(document.getElementById('inf-temp').value) / 100;
  const topP = parseInt(document.getElementById('inf-topp').value) / 100;
  const maxTok = parseInt(document.getElementById('inf-maxtok').value);
  
  const tokens = App.tokenizer.encode(prompt);
  const outEl = document.getElementById('infer-output');
  outEl.innerHTML = `<span style="color:var(--text-dim)">${escapeHtml(prompt)}</span>`;
  
  document.getElementById('sb-status').textContent = 'Generating';
  
  await App.inferencer.generate(tokens, maxTok, temp, topP, (tok) => {
    const span = document.createElement('span');
    span.className = 'new-token';
    span.textContent = App.tokenizer.decode([tok]);
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  });
  
  document.getElementById('sb-status').textContent = 'Idle';
  App.log('Generation complete', 'ok');
}

function stopInference() {
  if (App.inferencer) App.inferencer.stop();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportCheckpoint() {
  if (!App.model) return;
  
  const data = {
    cfg: App.model.cfg,
    emb: Array.from(App.model.emb),
    blocks: App.model.blocks.map(b => ({
      wr: Array.from(b.Wr.weight), wk: Array.from(b.Wk.weight),
      wv: Array.from(b.Wv.weight), wg: Array.from(b.Wg.weight),
      wo: Array.from(b.Wo.weight), wd: Array.from(b.Wdecay.weight),
      wk2: Array.from(b.Wk2.weight), wv2: Array.from(b.Wv2.weight),
      wr2: Array.from(b.Wr2.weight),
      ln1w: Array.from(b.ln1.weight), ln1b: Array.from(b.ln1.bias),
      ln2w: Array.from(b.ln2.weight), ln2b: Array.from(b.ln2.bias),
    })),
    head: Array.from(App.model.head.weight),
    ln_out_w: Array.from(App.model.ln_out.weight),
    ln_out_b: Array.from(App.model.ln_out.bias),
    vocab: App.tokenizer.vocab,
    merges: App.tokenizer.merges
  };
  
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `htmlnlm_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  App.log('Checkpoint exported', 'ok');
}
